<!doctype html>
<!-- Focusidea — public site landing. Self-contained. Host as-is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focusidea</title>
<style>
  :root { --bg:#ffffff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e4e4e8; --accent:#2b6cb0; --card:#f7f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e9e9ec; --muted:#9a9aa2; --line:#2c2d31; --accent:#7db4e6; --card:#1e1f23; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7;
  }
  .card { max-width:520px; width:calc(100% - 40px); padding:32px 28px; text-align:center; }
  h1 { font-size:2rem; margin:0 0 6px; }
  p.tag { color:var(--muted); margin:0 0 28px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.btn {
    display:block; padding:14px 18px; border:1px solid var(--line); border-radius:12px;
    background:var(--card); color:var(--fg); text-decoration:none; font-weight:600;
  }
  a.btn:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:28px; color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
  <main class="card">
    <h1>Focusidea</h1>
    <p class="tag">Personal Intelligence Support / 知的パーソナルサポート</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy / プライバシーポリシー</a>
      <a class="btn" href="support.html">Support / サポート</a>
    </div>
    <footer>Not a medical device. / 医療機器ではありません。</footer>
  </main>
</body>
</html>
